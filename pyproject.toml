[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-log-fixer"
version = "0.1.0"
description = "Read a failing GitHub Actions log, name the common cause, and suggest a concrete fix. Rules and code, no API, offline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Almeida" }]
requires-python = ">=3.10"
keywords = ["ci", "github-actions", "cli", "offline", "no-ai", "logs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/sponsors/fitzyracing1"
Repository = "https://github.com/fitzyracing1/ci-log-fixer"

[project.scripts]
ci-log-fixer = "ci_log_fixer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
